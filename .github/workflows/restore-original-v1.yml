name: Unpack original FarmSetu V1 source
on:
  push:
    branches:
      - original-v1-restored
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original application source
        run: bash scripts/restore-original-v1.sh
      - name: Commit full editable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already restored."
          else
            git commit -m "Restore original FarmSetu V1 source files and images"
            git push origin HEAD:original-v1-restored
          fi
